<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도트 고양이 메모리 게임 - MediaPipe 터치</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Hands Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --pixel-size: 4px;
        }

        body {
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Press Start 2P', cursive, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        .game-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 600px;
            margin: 20px auto;
            perspective: 1000px;
        }

        .card {
            aspect-ratio: 1 / 1;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border-radius: 15px;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            border: 4px solid #4e4e6a;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .card-front {
            background-color: #2e2e4a;
            background-image: radial-gradient(#4e4e6a 2px, transparent 2px);
            background-size: 20px 20px;
        }

        .card-back {
            background-color: #fff;
            transform: rotateY(180deg);
        }

        /* Dot Cat Styles */
        .cat-pixel {
            width: 80%;
            height: 80%;
            image-rendering: pixelated;
        }

        /* Video / Interaction Overlay */
        #video-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 150px;
            border: 3px solid #ff00ff;
            border-radius: 10px;
            overflow: hidden;
            z-index: 100;
            transform: scaleX(-1); /* Mirror effect */
        }

        #input_video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            background: rgba(255, 0, 255, 0.7);
            border: 2px solid white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            display: none;
            box-shadow: 0 0 15px #ff00ff;
        }

        .status-bar {
            text-align: center;
            padding: 10px;
            font-size: 14px;
            background: rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .pixel-btn {
            background: #ff00ff;
            padding: 10px 20px;
            border: none;
            box-shadow: 4px 4px 0px #880088;
            transition: all 0.1s;
        }

        .pixel-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #880088;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.5); opacity: 0.4; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .touch-effect {
            position: absolute;
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            animation: pulse 0.5s ease-out;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="status-bar">
        SCORE: <span id="score">0</span> | MOVES: <span id="moves">0</span>
        <div id="hand-status" style="font-size: 10px; margin-top: 5px; color: #00ff00;">CAMERA INITIALIZING...</div>
    </div>

    <div class="game-container" id="grid">
        <!-- Cards will be injected here -->
    </div>

    <div class="flex justify-center mt-6">
        <button onclick="resetGame()" class="pixel-btn">RESET GAME</button>
    </div>

    <div id="video-container">
        <video id="input_video"></video>
    </div>
    <div id="cursor"></div>

    <script>
        const grid = document.getElementById('grid');
        const scoreEl = document.getElementById('score');
        const movesEl = document.getElementById('moves');
        const cursorEl = document.getElementById('cursor');
        const handStatusEl = document.getElementById('hand-status');
        const videoElement = document.getElementById('input_video');

        let cards = [];
        let flippedCards = [];
        let score = 0;
        let moves = 0;
        let isLock = false;

        // Cat SVG Designs (Pixel Style)
        const cats = [
            // Black Cat
            `<svg viewBox="0 0 10 10" class="cat-pixel"><rect x="2" y="3" width="6" height="5" fill="black"/><rect x="2" y="2" width="1" height="1" fill="black"/><rect x="7" y="2" width="1" height="1" fill="black"/><rect x="3" y="4" width="1" height="1" fill="yellow"/><rect x="6" y="4" width="1" height="1" fill="yellow"/><rect x="4" y="5" width="2" height="1" fill="pink"/></svg>`,
            // Calico (Tricolor)
            `<svg viewBox="0 0 10 10" class="cat-pixel"><rect x="2" y="3" width="6" height="5" fill="#f0f0f0"/><rect x="2" y="3" width="3" height="2" fill="#d2691e"/><rect x="5" y="6" width="3" height="2" fill="#333"/><rect x="2" y="2" width="1" height="1" fill="#d2691e"/><rect x="7" y="2" width="1" height="1" fill="#333"/><rect x="3" y="4" width="1" height="1" fill="green"/><rect x="6" y="4" width="1" height="1" fill="green"/></svg>`,
            // Ginger (Cheese)
            `<svg viewBox="0 0 10 10" class="cat-pixel"><rect x="2" y="3" width="6" height="5" fill="#ff9933"/><rect x="2" y="4" width="6" height="1" fill="#ffcc66"/><rect x="2" y="6" width="6" height="1" fill="#ffcc66"/><rect x="2" y="2" width="1" height="1" fill="#ff9933"/><rect x="7" y="2" width="1" height="1" fill="#ff9933"/><rect x="3" y="4" width="1" height="1" fill="blue"/><rect x="6" y="4" width="1" height="1" fill="blue"/></svg>`,
            // Gray Cat
            `<svg viewBox="0 0 10 10" class="cat-pixel"><rect x="2" y="3" width="6" height="5" fill="#808080"/><rect x="2" y="2" width="1" height="1" fill="#808080"/><rect x="7" y="2" width="1" height="1" fill="#808080"/><rect x="3" y="4" width="1" height="1" fill="#33ff33"/><rect x="6" y="4" width="1" height="1" fill="#33ff33"/></svg>`,
            // Siamese
            `<svg viewBox="0 0 10 10" class="cat-pixel"><rect x="2" y="3" width="6" height="5" fill="#eaddca"/><rect x="4" y="4" width="2" height="3" fill="#4b3621"/><rect x="2" y="2" width="1" height="1" fill="#4b3621"/><rect x="7" y="2" width="1" height="1" fill="#4b3621"/><rect x="3" y="4" width="1" height="1" fill="skyblue"/><rect x="6" y="4" width="1" height="1" fill="skyblue"/></svg>`,
            // Tuxedo
            `<svg viewBox="0 0 10 10" class="cat-pixel"><rect x="2" y="3" width="6" height="5" fill="black"/><rect x="4" y="5" width="2" height="3" fill="white"/><rect x="2" y="2" width="1" height="1" fill="black"/><rect x="7" y="2" width="1" height="1" fill="black"/><rect x="3" y="4" width="1" height="1" fill="yellow"/><rect x="6" y="4" width="1" height="1" fill="yellow"/></svg>`,
            // White Cat
            `<svg viewBox="0 0 10 10" class="cat-pixel"><rect x="2" y="3" width="6" height="5" fill="white" stroke="#ccc" stroke-width="0.1"/><rect x="2" y="2" width="1" height="1" fill="white" stroke="#ccc" stroke-width="0.1"/><rect x="7" y="2" width="1" height="1" fill="white" stroke="#ccc" stroke-width="0.1"/><rect x="3" y="4" width="1" height="1" fill="pink"/><rect x="6" y="4" width="1" height="1" fill="pink"/></svg>`,
            // Russian Blue
            `<svg viewBox="0 0 10 10" class="cat-pixel"><rect x="2" y="3" width="6" height="5" fill="#5d6d7e"/><rect x="2" y="2" width="1" height="1" fill="#5d6d7e"/><rect x="7" y="2" width="1" height="1" fill="#5d6d7e"/><rect x="3" y="4" width="1" height="1" fill="#7dcea0"/><rect x="6" y="4" width="1" height="1" fill="#7dcea0"/></svg>`
        ];

        function createBoard() {
            const gameIcons = [...cats, ...cats];
            gameIcons.sort(() => Math.random() - 0.5);

            grid.innerHTML = '';
            cards = [];

            gameIcons.forEach((icon, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.id = index;
                card.dataset.icon = icon;

                card.innerHTML = `
                    <div class="card-face card-front"></div>
                    <div class="card-face card-back">${icon}</div>
                `;

                card.addEventListener('click', () => flipCard(card));
                grid.appendChild(card);
                cards.push(card);
            });
        }

        function flipCard(card) {
            if (isLock || flippedCards.includes(card) || card.classList.contains('flipped')) return;

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                movesEl.textContent = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            isLock = true;
            const [card1, card2] = flippedCards;

            if (card1.dataset.icon === card2.dataset.icon) {
                score++;
                scoreEl.textContent = score;
                flippedCards = [];
                isLock = false;
                if (score === cats.length) {
                    setTimeout(() => alert(`축하합니다! ${moves}번 만에 모든 고양이를 찾았어요!`), 500);
                }
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    isLock = false;
                }, 1000);
            }
        }

        function resetGame() {
            score = 0;
            moves = 0;
            scoreEl.textContent = 0;
            movesEl.textContent = 0;
            flippedCards = [];
            isLock = false;
            createBoard();
        }

        // --- MediaPipe Hand Tracking ---
        
        let lastTouchTime = 0;
        const TOUCH_COOLDOWN = 1000; // ms

        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                handStatusEl.textContent = "HAND DETECTED - USE INDEX FINGER";
                cursorEl.style.display = 'block';
                
                // Get index finger tip (landmark 8)
                const indexTip = results.multiHandLandmarks[0][8];
                
                // Screen coordinates (Mirrored X)
                const x = (1 - indexTip.x) * window.innerWidth;
                const y = indexTip.y * window.innerHeight;

                cursorEl.style.left = x + 'px';
                cursorEl.style.top = y + 'px';

                // Check collision with cards
                checkVirtualTouch(x, y);
            } else {
                handStatusEl.textContent = "SEARCHING FOR HAND...";
                cursorEl.style.display = 'none';
            }
        }

        function checkVirtualTouch(x, y) {
            const now = Date.now();
            if (now - lastTouchTime < TOUCH_COOLDOWN) return;

            const element = document.elementFromPoint(x, y);
            if (element) {
                const card = element.closest('.card');
                if (card && !card.classList.contains('flipped')) {
                    // Visual feedback
                    createTouchEffect(x, y);
                    
                    // Trigger click
                    card.click();
                    lastTouchTime = now;
                }
            }
        }

        function createTouchEffect(x, y) {
            const effect = document.createElement('div');
            effect.className = 'touch-effect';
            effect.style.left = (x - 20) + 'px';
            effect.style.top = (y - 20) + 'px';
            document.body.appendChild(effect);
            setTimeout(() => effect.remove(), 500);
        }

        const hands = new Hands({
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });
        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 640,
            height: 480
        });

        window.onload = () => {
            createBoard();
            camera.start().catch(err => {
                handStatusEl.textContent = "CAMERA ERROR: " + err.message;
                handStatusEl.style.color = "red";
            });
        };
    </script>
</body>
</html>
